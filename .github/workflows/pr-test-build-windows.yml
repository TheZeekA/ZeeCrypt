name: pr-test-build-windows

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
      - testing
  workflow_dispatch:

jobs:
  pr-test-build-windows:
    runs-on: windows-2025
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Setup Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: '1.27.x' # minor pinned; patch releases (security fixes) still picked up
        check-latest: true
        cache: false

    - name: Install dependencies
      run: |
        cd src
        go mod download

    - name: Build
      run: |
        cd src
        go build -v -ldflags="-s -w -H=windowsgui -extldflags=-static" -o 1.exe .
      env:
        CGO_ENABLED: 1
        GOAMD64: v1

    - name: Test
      run: |
        cd src
        go test ./...
      env:
        CGO_ENABLED: 1

    - name: Add manifest and version info
      run: |
        cd src
        go tool go-winres patch --in winres/winres.json --no-backup 1.exe

    - name: Compress with upx
      shell: pwsh
      run: |
        Invoke-WebRequest -OutFile upx.zip https://github.com/upx/upx/releases/download/v5.0.2/upx-5.0.2-win64.zip
        $upxHash = (Get-FileHash upx.zip -Algorithm SHA256).Hash
        if ($upxHash -ne "1CFF6D6EE01C404D4A1AE56003056BD4CFA28D0A5CEA1D0950DAAF872A4FACC9") { throw "upx.zip checksum mismatch: $upxHash" }
        Expand-Archive -DestinationPath upx upx.zip
        upx/upx-5.0.2-win64/upx.exe --lzma -o src/ZeeCrypt.exe src/1.exe

    - name: Upload artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: pr-test-build-windows-ONLY-FOR-TESTING
        path: src/*.exe
        if-no-files-found: error
        compression-level: 9
